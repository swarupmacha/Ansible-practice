- name: getting details from user
  hosts: local
  connection: local
  vars_prompt:
  - name: username
    prompt: Please enter your username
    private: false
  
  - name: password
    prompt: Please enter password
    private: true

  tasks:
  - name: printing username and password
    ansible.builtin.debug:
      msg: "username is {{ username }} and passowrd is {{ passowrd }}"