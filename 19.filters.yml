- name: demo on filters
  hosts: localhost
  connection: local
  vars:
    topics: linux, shell, anisble, terraform
  tasks:
  - name: greetings from filters
    ansible.builtin.debug:
      msg: "Hi Swarup, {{ GREETINGS | default('Good Morning')}}"

  - name: convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"
