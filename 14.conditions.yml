- name: "printing ansible facts:"
  hosts: localhost
  connection: local
  tasks:
  - name: printing anisble facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts }}"

  - name: check redhut or not
    ansible.builtin.debug:
      msg: "yes package is redhat"
    when: ansible_facts.os_family == "Redhat"