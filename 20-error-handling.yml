- name: demo on error handling
  hosts: localhost
  connection: local
  tasks:
  - name: check user exists or not
    ansible.builtin.shell: id roboshop
    register: user_output
    ignore_errors: true

  - name: print the user_output
    debug:
      msg: "{{ user_output }}"
  
  - name: create user
    anisble.builtin.command: useradd swarupp
    when: user_output.rc != 0